name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

# Least-privilege token: read the repo, write a Pages deployment, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer deploy finish and cancel the older
# one — but never cancel a deploy that is already mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm ci installs the EXACT versions in package-lock.json. If this step
        # fails with "lock file out of sync", run `npm install` locally and
        # commit the updated package-lock.json.
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # These two are optional. Leave the repository secrets unset and the
        # site still builds and works — the Impact page falls back to the
        # snapshot committed in src/data/impact-snapshot.json.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify the build produced what we expect
        # Cheap insurance against a silently empty deploy.
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "::error::dist/404.html missing"; exit 1; }
          ls dist/assets/*.js  >/dev/null || { echo "::error::no JS bundle emitted"; exit 1; }
          ls dist/assets/*.css >/dev/null || { echo "::error::no CSS bundle emitted"; exit 1; }
          grep -q './assets/' dist/index.html || { echo "::error::asset paths are not relative — check base in vite.config.ts"; exit 1; }
          echo "Build verified:"; ls -la dist

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
